name: Apply final UI fixes

on:
  push:
    paths:
      - '.github/workflows/fix-final-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply guarded UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Master Data: recognize Manager in Role Authority display.
          p = Path('src/components/MasterDataManager.tsx')
          s = p.read_text()
          old = '''                            op.role === "admin" 
                              ? "bg-red-500/10 text-red-600 border border-red-500/20" 
                              : op.role === "supervisor"
                              ? "bg-blue-500/10 text-blue-600 border border-blue-500/20"
                              : op.role === "leader"
                              ? "bg-emerald-500/10 text-emerald-600 border border-emerald-500/20"
                              : "bg-slate-500/10 text-slate-600 border border-slate-500/20"
                          }`}>
                            {op.role === "admin" ? "Admin/Developer" : op.role === "supervisor" ? "Leader/SPV" : op.role === "leader" ? "Leader/Tech" : "Operator"}'''
          new = '''                            op.role === "admin"
                              ? "bg-red-500/10 text-red-600 border border-red-500/20"
                              : op.role === "manager"
                              ? "bg-violet-500/10 text-violet-600 border border-violet-500/20"
                              : op.role === "supervisor"
                              ? "bg-blue-500/10 text-blue-600 border border-blue-500/20"
                              : op.role === "leader"
                              ? "bg-emerald-500/10 text-emerald-600 border border-emerald-500/20"
                              : "bg-slate-500/10 text-slate-600 border border-slate-500/20"
                          }`}>
                            {op.role === "admin"
                              ? "Admin"
                              : op.role === "manager"
                              ? "Manager"
                              : op.role === "supervisor"
                              ? "Supervisor"
                              : op.role === "leader"
                              ? "Leader / PIC"
                              : "Operator"}'''
          if old not in s:
              raise SystemExit('Guard failed: Role Authority block not found')
          p.write_text(s.replace(old, new, 1))

          # 2) Active Andon notification: icon follows the same normalized category as its color.
          p = Path('src/components/OperatorTerminal.tsx')
          s = p.read_text()
          marker = '''  const activeCallTheme = activeCallPrimaryCategory === "leader_call"'''
          insert = '''  const ActiveCallIcon = activeCallPrimaryCategory === "leader_call"
    ? UserCheck
    : activeCallPrimaryCategory === "material_support"
      ? Boxes
      : Flame;

  const activeCallTheme = activeCallPrimaryCategory === "leader_call"'''
          if marker not in s:
              raise SystemExit('Guard failed: activeCallTheme marker not found')
          s = s.replace(marker, insert, 1)
          old_icon = '<Flame className="w-7 h-7" />'
          new_icon = '<ActiveCallIcon className="w-7 h-7" />'
          if old_icon not in s:
              raise SystemExit('Guard failed: active notification Flame icon not found')
          s = s.replace(old_icon, new_icon, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit verified fixes and remove one-shot workflow
        run: |
          rm .github/workflows/fix-final-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MasterDataManager.tsx src/components/OperatorTerminal.tsx .github/workflows/fix-final-ui.yml
          git commit -m "fix: align manager authority and Andon notification icons"
          git push origin main

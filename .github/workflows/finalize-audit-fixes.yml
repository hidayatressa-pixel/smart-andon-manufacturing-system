name: Finalize audited fixes

on:
  push:
    paths:
      - .github/workflows/finalize-audit-fixes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(text.replace(old, new))

          # Runtime bug 1: complete five-role model in Master Data editor.
          replace_exact(
              "src/components/MasterDataManager.tsx",
              '''                    <option value="operator">Operator (Hanya Panggilan Operator)</option>\n                    <option value="leader">Leader / Maintenance (Kecuali Panggilan & Master Data)</option>\n                    <option value="supervisor">Supervisor / Leader (Kecuali Panggilan & Master Data)</option>\n                    <option value="admin">Admin / Developer (Akses Penuh)</option>''',
              '''                    <option value="operator">{language === "en" ? "Operator (Operator Call)" : "Operator (Panggilan Operator)"}</option>\n                    <option value="leader">{language === "en" ? "Leader / PIC (Operational Response)" : "Leader / PIC (Respons Operasional)"}</option>\n                    <option value="supervisor">{language === "en" ? "Supervisor (Operations & Reports)" : "Supervisor (Operasional & Laporan)"}</option>\n                    <option value="manager">{language === "en" ? "Manager (All Operational Features)" : "Manager (Seluruh Fitur Operasional)"}</option>\n                    <option value="admin">{language === "en" ? "Admin (System Administration)" : "Admin (Administrasi Sistem)"}</option>'''
          )

          # Runtime bug 2: active-call banner follows Andon category color.
          p = Path("src/components/OperatorTerminal.tsx")
          text = p.read_text()
          marker = '''  const activeCategoryItem = PRIMARY_ANDON_BUTTONS.find(\n    (b) => b.id === selectedCategory || normalizeCategoryToPrimary(selectedCategory) === b.id\n  ) || PRIMARY_ANDON_BUTTONS[0];\n\n  return ('''
          replacement = '''  const activeCategoryItem = PRIMARY_ANDON_BUTTONS.find(\n    (b) => b.id === selectedCategory || normalizeCategoryToPrimary(selectedCategory) === b.id\n  ) || PRIMARY_ANDON_BUTTONS[0];\n\n  const activeCallPrimaryCategory = existingCall\n    ? normalizeCategoryToPrimary(existingCall.category)\n    : "abnormal_machine";\n  const activeCallTheme = activeCallPrimaryCategory === "leader_call"\n    ? {\n        panelLight: "bg-amber-50 border-amber-400 text-amber-950",\n        panelDark: "bg-amber-950/40 border-amber-500 text-neutral-100",\n        badge: "bg-amber-500 text-slate-950",\n        icon: "bg-amber-500 text-slate-950",\n        detail: "text-amber-700 dark:text-amber-300",\n      }\n    : activeCallPrimaryCategory === "material_support"\n      ? {\n          panelLight: "bg-emerald-50 border-emerald-400 text-emerald-950",\n          panelDark: "bg-emerald-950/40 border-emerald-500 text-neutral-100",\n          badge: "bg-emerald-600 text-white",\n          icon: "bg-emerald-600 text-white",\n          detail: "text-emerald-700 dark:text-emerald-300",\n        }\n      : {\n          panelLight: "bg-red-50 border-red-400 text-red-950",\n          panelDark: "bg-red-950/40 border-red-500 text-neutral-100",\n          badge: "bg-red-600 text-white",\n          icon: "bg-red-600 text-white",\n          detail: "text-red-700 dark:text-red-300",\n        };\n\n  return ('''
          if marker not in text:
              raise SystemExit("OperatorTerminal category marker not found")
          text = text.replace(marker, replacement)
          text = text.replace(
              '''          isLight \n            ? "bg-red-50 border-red-400 text-red-950" \n            : "bg-red-950/40 border-red-500 text-neutral-100"''',
              '''          isLight ? activeCallTheme.panelLight : activeCallTheme.panelDark'''
          )
          text = text.replace('''            <div className="p-3 bg-red-600 rounded-2xl text-white shadow-md">''', '''            <div className={`p-3 rounded-2xl shadow-md ${activeCallTheme.icon}`}>''')
          text = text.replace('''                <span className="bg-red-600 text-white font-mono text-xs px-2 py-0.5 rounded font-black uppercase">''', '''                <span className={`font-mono text-xs px-2 py-0.5 rounded font-black uppercase ${activeCallTheme.badge}`}>''')
          text = text.replace('''              <div className="text-xs text-amber-700 dark:text-amber-300 mt-2 font-mono flex items-center gap-3 font-bold">''', '''              <div className={`text-xs mt-2 font-mono flex items-center gap-3 font-bold ${activeCallTheme.detail}`}>''')
          p.write_text(text)

          # Safe Sonar cleanup: identical conditional literals and explicit Number parsing.
          for p in Path("src").rglob("*.tsx"):
              text = p.read_text()
              text = re.sub(r'language\s*===\s*"en"\s*\?\s*("[^"\\]*(?:\\.[^"\\]*)*")\s*:\s*\1', r'\1', text)
              text = re.sub(r'(?<![\w.])parseInt\(', 'Number.parseInt(', text)
              text = re.sub(r'(?<![\w.])parseFloat\(', 'Number.parseFloat(', text)
              p.write_text(text)
          for p in Path("src").rglob("*.ts"):
              text = p.read_text()
              text = re.sub(r'(?<![\w.])parseInt\(', 'Number.parseInt(', text)
              text = re.sub(r'(?<![\w.])parseFloat\(', 'Number.parseFloat(', text)
              p.write_text(text)

          # Replace security-sensitive pseudo-random identifiers only; simulation randomness remains intentional.
          replacements = {
              "src/lib/firestoreService.ts": [
                  ('`LOG-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`', '`LOG-${crypto.randomUUID()}`'),
              ],
              "src/components/LoginModal.tsx": [
                  ('`EMP-${Math.floor(1000 + Math.random() * 9000)}`', '`EMP-${crypto.randomUUID().slice(0, 8).toUpperCase()}`'),
              ],
          }
          for file, pairs in replacements.items():
              p = Path(file)
              text = p.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              p.write_text(text)

          # Remove this one-shot workflow from the release tree after it performs its job.
          Path(".github/workflows/finalize-audit-fixes.yml").unlink()

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize runtime roles colors and Sonar cleanup"
          git push origin HEAD:main

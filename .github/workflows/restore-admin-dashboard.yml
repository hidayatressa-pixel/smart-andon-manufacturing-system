name: Restore Admin Dashboard
on:
  push:
    paths:
      - '.github/workflows/restore-admin-dashboard.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore corrupted AdminDashboard only
        run: git show d7400ed80a9d7c28f43aced11cb8a0d31b574e03:src/components/AdminDashboard.tsx > src/components/AdminDashboard.tsx
      - name: Verify production build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit verified recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminDashboard.tsx
          if git diff --cached --quiet; then
            echo 'No recovery changes needed.'
            exit 0
          fi
          git commit -m 'fix: restore corrupted AdminDashboard component'
          git push origin HEAD:main

name: Apply consolidated application revision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-role-factory-revision.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source revision
        shell: python
        run: |
          from pathlib import Path
          import re

          # Standardize terminology and rename the legacy technician role throughout source/docs/templates.
          text_exts = {'.ts', '.tsx', '.md', '.csv', '.json'}
          for root in [Path('src'), Path('assets/instruction_guide')]:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in text_exts:
                      s = p.read_text(encoding='utf-8')
                      s = s.replace('technician', 'leader').replace('Technician', 'Leader / PIC').replace('TECHNICIAN', 'LEADER / PIC')
                      s = s.replace('Lini', 'Line').replace('lini', 'line').replace('LINI', 'LINE')
                      p.write_text(s, encoding='utf-8')

          # Manager is a first-class importable role in Master Data.
          p = Path('src/components/MasterDataManager.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''if (roleRaw.includes("admin") || roleRaw.includes("dev")) {\n            role = "admin";\n          } else if (roleRaw.includes("lead") || roleRaw.includes("tech") || roleRaw.includes("maint") || roleRaw.includes("mekanik")) {\n            role = "leader";\n          } else if (roleRaw.includes("super") || roleRaw.includes("spv") || roleRaw.includes("foreman") || roleRaw.includes("karu")) {\n            role = "supervisor";\n          }'''
          new = '''if (roleRaw.includes("admin") || roleRaw.includes("dev")) {\n            role = "admin";\n          } else if (roleRaw.includes("manager") || roleRaw.includes("mgr")) {\n            role = "manager";\n          } else if (roleRaw.includes("super") || roleRaw.includes("spv") || roleRaw.includes("foreman") || roleRaw.includes("karu")) {\n            role = "supervisor";\n          } else if (roleRaw.includes("lead") || roleRaw.includes("pic") || roleRaw.includes("tech") || roleRaw.includes("maint") || roleRaw.includes("mekanik")) {\n            role = "leader";\n          }'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Manager sees all operational menus, including Operator Call, but never Admin Console/Master Data/Settings.
          p = Path('src/components/Header.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('(isAdmin || isOperator) && (', '(isAdmin || isOperator || currentUser?.role === "manager") && (')
          p.write_text(s, encoding='utf-8')

          # Manager must also pass supervisor-level operational destructive/cancel actions.
          p = Path('src/lib/firestoreService.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('!["admin", "supervisor"].includes(currentUser.role)', '!["admin", "manager", "supervisor"].includes(currentUser.role)')

          helper = '''\nasync function deleteCollectionInChunks(collectionName: string, preserveDocIds: Set<string> = new Set()): Promise<void> {\n  const snapshot = await getDocs(collection(db, collectionName));\n  const docsToDelete = snapshot.docs.filter((d) => !preserveDocIds.has(d.id));\n  for (let i = 0; i < docsToDelete.length; i += 450) {\n    const batch = writeBatch(db);\n    docsToDelete.slice(i, i + 450).forEach((d) => batch.delete(d.ref));\n    await batch.commit();\n  }\n}\n\n'''
          marker = '/**\n * Wipes all trial data (calls, test logs) and resets lines to clean state.\n */'
          if helper.strip() not in s and marker in s:
              s = s.replace(marker, helper + marker)

          pattern = re.compile(r'''/\*\*\n \* Wipes all trial data \(calls, test logs\) and resets lines to clean state\.\n \*/\nexport async function clearAllTrialDataInDb\([\s\S]*?\n}\n\n// ==========================================\n// 3\. MASTER LINES''')
          replacement = '''/**\n * Factory Clean: removes operational/master production data while preserving only default master users.\n * System configuration/branding/Firebase configuration are intentionally preserved.\n */\nexport async function clearAllTrialDataInDb(\n  _defaultLines: AndonLine[],\n  currentUser?: { name: string; id: string; role: string }\n): Promise<void> {\n  assertAdminAction(currentUser);\n\n  if (IS_DEMO_MODE) {\n    demoState.calls = [];\n    demoState.logs = [];\n    demoState.lines = [];\n    demoState.machines = [];\n    demoState.operators = DEFAULT_USERS.map((user) => ({ ...user }));\n\n    setLocalStorageData(DEMO_KEYS.CALLS, demoState.calls);\n    setLocalStorageData(DEMO_KEYS.LOGS, demoState.logs);\n    setLocalStorageData(DEMO_KEYS.LINES, demoState.lines);\n    setLocalStorageData(DEMO_KEYS.MACHINES, demoState.machines);\n    setLocalStorageData(DEMO_KEYS.OPERATORS, demoState.operators);\n\n    notifySubscribers("calls");\n    notifySubscribers("logs");\n    notifySubscribers("lines");\n    notifySubscribers("machines");\n    notifySubscribers("operators");\n    return;\n  }\n\n  // Production is fail-closed: never pretend a remote reset succeeded by silently using local fallback.\n  const defaultBadges = new Set(DEFAULT_USERS.map((user) => user.badgeId));\n  const operatorSnapshot = await getDocs(collection(db, COLLECTIONS.OPERATORS));\n  const defaultOperatorDocIds = new Set(\n    operatorSnapshot.docs\n      .filter((d) => defaultBadges.has(String(d.data().badgeId || "")))\n      .map((d) => d.id)\n  );\n\n  // Never allow Factory Clean to remove the currently authenticated admin profile.\n  const activeAdminDoc = operatorSnapshot.docs.find((d) =>\n    d.id === currentUser?.id || String(d.data().badgeId || "") === currentUser?.id\n  );\n  if (activeAdminDoc) defaultOperatorDocIds.add(activeAdminDoc.id);\n\n  await deleteCollectionInChunks(COLLECTIONS.CALLS);\n  await deleteCollectionInChunks(COLLECTIONS.LOGS);\n  await deleteCollectionInChunks(COLLECTIONS.LINES);\n  await deleteCollectionInChunks(COLLECTIONS.MACHINES);\n  await deleteCollectionInChunks(COLLECTIONS.OPERATORS, defaultOperatorDocIds);\n\n  if (typeof window !== "undefined") {\n    localStorage.removeItem("andon_smart_factory_calls_v1");\n  }\n}\n\n// ==========================================\n// 3. MASTER LINES'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Factory Clean function pattern not found; refusing partial reset rewrite')
          p.write_text(s2, encoding='utf-8')

      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src assets/instruction_guide
          if git diff --cached --quiet; then
            echo "No source changes required"
          else
            git commit -m "feat: apply Leader PIC Manager and factory clean revision"
            git push
          fi

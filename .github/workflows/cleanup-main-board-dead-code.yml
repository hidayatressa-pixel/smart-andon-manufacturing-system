name: One-time MainAndonBoard cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove dead guide code
        shell: python
        run: |
          from pathlib import Path

          board = Path('src/components/MainAndonBoard.tsx')
          text = board.read_text()
          text = text.replace('import { \n  AlertOctagon, \n  CheckCircle2, \n  Clock, \n  Flame, \n  AlertTriangle, \n  \n  TrendingUp, \n  Activity, \n  Zap,\n    Boxes,\n            } from "lucide-react";', 'import { AlertOctagon, CheckCircle2, Clock, Flame, AlertTriangle, TrendingUp, Activity, Zap, Boxes } from "lucide-react";')
          text = text.replace('  onNavigateToCall: (lineId: string) => void;\n', '')
          text = text.replace('  onNavigateToCall,\n', '')
          board.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace(' onNavigateToCall={(lineId) => { setSelectedLineId(lineId); setActiveTab("operator_call"); }}', '')
          app.write_text(text)

          workflow = Path('.github/workflows/cleanup-main-board-dead-code.yml')
          workflow.unlink()
      - name: Verify removed symbols
        run: |
          ! grep -R "onNavigateToCall\|quickGuideSubtitle\|step1Desc\|step2Desc\|step3Desc\|step4Desc" src/components/MainAndonBoard.tsx src/App.tsx
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MainAndonBoard.tsx src/App.tsx .github/workflows/cleanup-main-board-dead-code.yml
          git commit -m "chore: remove MainAndonBoard guide dead code"
          git push origin main

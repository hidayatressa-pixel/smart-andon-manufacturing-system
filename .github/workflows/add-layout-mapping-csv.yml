name: Add 2D Layout CSV Mapping
on:
  push:
    paths:
      - '.github/workflows/add-layout-mapping-csv.yml'
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch layout CSV feature
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/lib/layoutMappingService.ts')
          p.write_text('''import { doc, onSnapshot, setDoc } from "firebase/firestore";\nimport { db, COLLECTIONS } from "./firebase";\nimport { IS_DEMO_MODE, cleanFirestorePayload } from "./firestoreService";\n\nexport interface LayoutMappingItem {\n  lineId: string;\n  row: number;\n  column: number;\n  sequence: number;\n}\n\nconst DEMO_KEY = "layout_mapping_2d_demo_v1";\n\nfunction normalize(items: LayoutMappingItem[]): LayoutMappingItem[] {\n  return items.filter((x) => x.lineId && Number.isInteger(x.row) && x.row > 0 && Number.isInteger(x.column) && x.column > 0 && Number.isInteger(x.sequence) && x.sequence > 0).sort((a,b) => a.sequence-b.sequence);\n}\nexport function subscribeLayoutMapping(callback: (items: LayoutMappingItem[]) => void): () => void {\n  if (IS_DEMO_MODE) {\n    const emit=()=>{ try { callback(normalize(JSON.parse(localStorage.getItem(DEMO_KEY)||"[]"))); } catch { callback([]); } };\n    emit(); window.addEventListener("layout-mapping-updated",emit); return ()=>window.removeEventListener("layout-mapping-updated",emit);\n  }\n  return onSnapshot(doc(db,COLLECTIONS.CONFIG,"layout_mapping"),(snap)=>{ const data=snap.exists()?snap.data():{}; callback(normalize(Array.isArray(data.items)?data.items as LayoutMappingItem[]:[])); },()=>callback([]));\n}\nexport async function saveLayoutMapping(items: LayoutMappingItem[], currentUser?: { role: string }): Promise<void> {\n  if (!currentUser || currentUser.role !== "admin") throw new Error("Unauthorized: administrator privileges required.");\n  const normalized=normalize(items);\n  if (IS_DEMO_MODE) { localStorage.setItem(DEMO_KEY,JSON.stringify(normalized)); window.dispatchEvent(new Event("layout-mapping-updated")); return; }\n  await setDoc(doc(db,COLLECTIONS.CONFIG,"layout_mapping"),cleanFirestorePayload({items:normalized,updatedAt:Date.now()}));\n}\n''',encoding='utf-8')

          p=Path('src/components/PlantLayoutMap.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('import React, { useState } from "react";','import React, { useEffect, useMemo, useState } from "react";',1)
          s=s.replace('import { getTranslation, TranslationKey } from "../utils/i18n";','import { getTranslation, TranslationKey } from "../utils/i18n";\nimport { LayoutMappingItem, subscribeLayoutMapping } from "../lib/layoutMappingService";',1)
          anchor='  const [selectedLineForDetail, setSelectedLineForDetail] = useState<AndonLine | null>(lines[0] || null);'
          if anchor not in s: raise SystemExit('PlantLayout state anchor not found')
          s=s.replace(anchor,anchor+'''\n  const [layoutMapping, setLayoutMapping] = useState<LayoutMappingItem[]>([]);\n  useEffect(() => subscribeLayoutMapping(setLayoutMapping), []);\n  const mappedLines = useMemo(() => {\n    if (!layoutMapping.length) return lines.map((line,index)=>({line,row:Math.floor(index/2)+1,column:(index%2)+1,sequence:index+1}));\n    const byId=new Map(lines.map(line=>[line.id,line]));\n    const configured=layoutMapping.map(item=>({...item,line:byId.get(item.lineId)})).filter((item): item is LayoutMappingItem & { line: AndonLine } => Boolean(item.line));\n    const ids=new Set(configured.map(item=>item.lineId)); const maxRow=configured.reduce((m,item)=>Math.max(m,item.row),0);\n    const remainder=lines.filter(line=>!ids.has(line.id)).map((line,index)=>({line,row:maxRow+Math.floor(index/2)+1,column:(index%2)+1,sequence:100000+index}));\n    return [...configured,...remainder].sort((a,b)=>a.sequence-b.sequence);\n  },[layoutMapping,lines]);\n  const layoutColumns=useMemo(()=>Math.max(2,...mappedLines.map(item=>item.column)),[mappedLines]);''',1)
          old='<div className="grid grid-cols-1 sm:grid-cols-2 gap-4 relative z-10">\n            {lines.map((line) => {'
          if old not in s: raise SystemExit('Plant grid anchor not found')
          s=s.replace(old,'<div className="grid gap-4 relative z-10" style={{ gridTemplateColumns: `repeat(${layoutColumns}, minmax(0, 1fr))` }}>\n            {mappedLines.map(({ line, row, column }) => {',1)
          old='                  key={line.id}\n                  id={`map-node-${line.id}`}\n                  onClick={() => setSelectedLineForDetail(line)}'
          if old not in s: raise SystemExit('Plant card anchor not found')
          s=s.replace(old,'                  key={line.id}\n                  id={`map-node-${line.id}`}\n                  style={{ gridRow: row, gridColumn: column }}\n                  onClick={() => setSelectedLineForDetail(line)}',1)
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/MasterDataManager.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('import { canManageMasterData } from "../utils/permissions";','import { canManageMasterData } from "../utils/permissions";\nimport { LayoutMappingItem, saveLayoutMapping } from "../lib/layoutMappingService";',1)
          # Add Map to lucide import robustly by locating Building2 token.
          if '  Map,' not in s and '  Map\n' not in s:
            s=s.replace('  Building2,','  Building2,\n  Map,',1) if '  Building2,' in s else s.replace('  Building2\n','  Building2,\n  Map\n',1)
          anchor='  const fileInputRef = useRef<HTMLInputElement>(null);'
          if anchor not in s: raise SystemExit('MasterData ref anchor not found')
          s=s.replace(anchor,anchor+'''\n  const layoutFileInputRef = useRef<HTMLInputElement>(null);\n  const downloadLayoutMappingTemplate = () => {\n    const csv=["line_id,row,column,sequence","LINE-1,1,1,1","LINE-2,2,1,2","LINE-3,2,2,3","LINE-4,1,2,4"].join("\\n");\n    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})); const a=document.createElement("a"); a.href=url; a.download="template_mapping_2d.csv"; a.click(); URL.revokeObjectURL(url);\n  };\n  const handleLayoutMappingUpload=(e:React.ChangeEvent<HTMLInputElement>)=>{\n    const file=e.target.files?.[0]; if(!file)return;\n    Papa.parse<Record<string,string>>(file,{header:true,skipEmptyLines:"greedy",complete:async({data})=>{try{const seen=new Set<string>(); const items:LayoutMappingItem[]=data.map((row,index)=>{const lineId=String(row.line_id||"").trim(); const r=Number.parseInt(String(row.row||""),10); const c=Number.parseInt(String(row.column||""),10); const sequence=Number.parseInt(String(row.sequence||""),10); if(!lineId||!Number.isInteger(r)||r<1||!Number.isInteger(c)||c<1||!Number.isInteger(sequence)||sequence<1)throw new Error(`Baris ${index+2}: data mapping tidak valid.`); if(!lines.some(line=>line.id===lineId))throw new Error(`Baris ${index+2}: line_id ${lineId} tidak ditemukan di Master Line.`); const cell=`${r}:${c}`; if(seen.has(cell))throw new Error(`Baris ${index+2}: posisi row ${r}, column ${c} sudah digunakan.`); seen.add(cell); return {lineId,row:r,column:c,sequence};}); await saveLayoutMapping(items,currentUser||undefined); setUploadStatus({success:true,message:`Mapping 2D berhasil disimpan: ${items.length} line.`});}catch(err){setUploadStatus({success:false,message:err instanceof Error?err.message:String(err)});}finally{if(layoutFileInputRef.current)layoutFileInputRef.current.value="";}},error:(err)=>setUploadStatus({success:false,message:`Gagal membaca CSV mapping: ${err.message}`})});\n  };''',1)
          # Put the card at the beginning of the templates panel using the templates tab condition, avoiding fragile closing-boundary matching.
          marker="{activeSubTab === 'templates' && ("
          idx=s.find(marker)
          if idx<0: raise SystemExit('Templates tab marker not found')
          divpos=s.find('<div',idx)
          end=s.find('>',divpos)+1
          card='''\n          <div className={`border rounded-3xl p-5 space-y-3 shadow-sm ${isLight ? "bg-white border-slate-200" : "bg-neutral-900 border-neutral-800"}`}>\n            <div className="flex items-center gap-2"><Map className="w-5 h-5 text-emerald-500" /><h4 className={`font-black text-sm ${isLight ? "text-slate-900" : "text-white"}`}>Mapping Layout 2D</h4></div>\n            <p className={`text-xs ${isLight ? "text-slate-600" : "text-neutral-400"}`}>{language === "id" ? "Atur posisi visual setiap Line dengan row, column, dan urutan proses." : "Configure each Line position using row, column, and process sequence."}</p>\n            <div className="flex flex-wrap gap-2">\n              <button onClick={downloadLayoutMappingTemplate} className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border ${isLight ? "bg-slate-50 text-slate-800 border-slate-300" : "bg-neutral-800 text-neutral-200 border-neutral-700"}`}><Download className="w-3.5 h-3.5" /> Download Template Layout 2D</button>\n              {canManageMaster && <><input ref={layoutFileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleLayoutMappingUpload}/><button onClick={()=>layoutFileInputRef.current?.click()} className="px-4 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white"><Upload className="w-3.5 h-3.5" /> Upload Mapping Layout 2D</button></>}\n            </div><div className={`text-[10px] font-mono ${isLight ? "text-slate-500" : "text-neutral-500"}`}>CSV: line_id,row,column,sequence</div>\n          </div>'''
          s=s[:end]+card+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Build and verify
        run: |
          npm run build
          git diff --check
      - name: Commit source changes and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-layout-mapping-csv.yml
          git add src/components/PlantLayoutMap.tsx src/components/MasterDataManager.tsx src/lib/layoutMappingService.ts
          git commit -m "feat: add CSV configurable 2D plant layout mapping"
          git push

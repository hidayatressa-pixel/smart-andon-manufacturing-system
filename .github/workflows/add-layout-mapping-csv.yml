name: Add 2D Layout CSV Mapping
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch layout CSV feature
        shell: python
        run: |
          from pathlib import Path

          # 1) Dedicated persistence service: system_config/layout_mapping in production, localStorage in demo.
          p=Path('src/lib/layoutMappingService.ts')
          p.write_text('''import { doc, onSnapshot, setDoc } from "firebase/firestore";\nimport { db, COLLECTIONS } from "./firebase";\nimport { IS_DEMO_MODE, cleanFirestorePayload } from "./firestoreService";\n\nexport interface LayoutMappingItem {\n  lineId: string;\n  row: number;\n  column: number;\n  sequence: number;\n}\n\nconst DEMO_KEY = "layout_mapping_2d_demo_v1";\n\nfunction normalize(items: LayoutMappingItem[]): LayoutMappingItem[] {\n  return items\n    .filter((x) => x.lineId && Number.isInteger(x.row) && x.row > 0 && Number.isInteger(x.column) && x.column > 0 && Number.isInteger(x.sequence) && x.sequence > 0)\n    .sort((a, b) => a.sequence - b.sequence);\n}\n\nexport function subscribeLayoutMapping(callback: (items: LayoutMappingItem[]) => void): () => void {\n  if (IS_DEMO_MODE) {\n    try { callback(normalize(JSON.parse(localStorage.getItem(DEMO_KEY) || "[]"))); } catch { callback([]); }\n    const handler = () => { try { callback(normalize(JSON.parse(localStorage.getItem(DEMO_KEY) || "[]"))); } catch { callback([]); } };\n    window.addEventListener("layout-mapping-updated", handler);\n    return () => window.removeEventListener("layout-mapping-updated", handler);\n  }\n  return onSnapshot(doc(db, COLLECTIONS.CONFIG, "layout_mapping"), (snap) => {\n    const data = snap.exists() ? snap.data() : {};\n    callback(normalize(Array.isArray(data.items) ? data.items as LayoutMappingItem[] : []));\n  }, () => callback([]));\n}\n\nexport async function saveLayoutMapping(items: LayoutMappingItem[], currentUser?: { role: string }): Promise<void> {\n  if (!currentUser || currentUser.role !== "admin") throw new Error("Unauthorized: administrator privileges required.");\n  const normalized = normalize(items);\n  if (IS_DEMO_MODE) {\n    localStorage.setItem(DEMO_KEY, JSON.stringify(normalized));\n    window.dispatchEvent(new Event("layout-mapping-updated"));\n    return;\n  }\n  await setDoc(doc(db, COLLECTIONS.CONFIG, "layout_mapping"), cleanFirestorePayload({ items: normalized, updatedAt: Date.now() }));\n}\n''', encoding='utf-8')

          # 2) Plant map: subscribe to mapping and place existing cards by row/column. No mapping = existing order/fallback.
          p=Path('src/components/PlantLayoutMap.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import React, { useState } from "react";', 'import React, { useEffect, useMemo, useState } from "react";')
          s=s.replace('import { getTranslation, TranslationKey } from "../utils/i18n";', 'import { getTranslation, TranslationKey } from "../utils/i18n";\nimport { LayoutMappingItem, subscribeLayoutMapping } from "../lib/layoutMappingService";')
          anchor='  const [selectedLineForDetail, setSelectedLineForDetail] = useState<AndonLine | null>(lines[0] || null);'
          inject=anchor+'''\n  const [layoutMapping, setLayoutMapping] = useState<LayoutMappingItem[]>([]);\n\n  useEffect(() => subscribeLayoutMapping(setLayoutMapping), []);\n\n  const mappedLines = useMemo(() => {\n    if (layoutMapping.length === 0) return lines.map((line, index) => ({ line, row: Math.floor(index / 2) + 1, column: (index % 2) + 1, sequence: index + 1 }));\n    const byId = new Map(lines.map((line) => [line.id, line]));\n    const configured = layoutMapping\n      .map((item) => ({ ...item, line: byId.get(item.lineId) }))\n      .filter((item): item is LayoutMappingItem & { line: AndonLine } => Boolean(item.line));\n    const configuredIds = new Set(configured.map((item) => item.lineId));\n    const maxRow = configured.reduce((max, item) => Math.max(max, item.row), 0);\n    const remainder = lines.filter((line) => !configuredIds.has(line.id)).map((line, index) => ({\n      line, row: maxRow + Math.floor(index / 2) + 1, column: (index % 2) + 1, sequence: 100000 + index\n    }));\n    return [...configured, ...remainder].sort((a, b) => a.sequence - b.sequence);\n  }, [layoutMapping, lines]);\n\n  const layoutColumns = useMemo(() => Math.max(2, ...mappedLines.map((item) => item.column)), [mappedLines]);'''
          if anchor not in s: raise SystemExit('PlantLayout state anchor not found')
          s=s.replace(anchor, inject, 1)
          old='<div className="grid grid-cols-1 sm:grid-cols-2 gap-4 relative z-10">\n            {lines.map((line) => {'
          new='<div className="grid gap-4 relative z-10" style={{ gridTemplateColumns: `repeat(${layoutColumns}, minmax(0, 1fr))` }}>\n            {mappedLines.map(({ line, row, column }) => {'
          if old not in s: raise SystemExit('Plant grid anchor not found')
          s=s.replace(old,new,1)
          old='                  key={line.id}\n                  id={`map-node-${line.id}`}\n                  onClick={() => setSelectedLineForDetail(line)}'
          new='                  key={line.id}\n                  id={`map-node-${line.id}`}\n                  style={{ gridRow: row, gridColumn: column }}\n                  onClick={() => setSelectedLineForDetail(line)}'
          if old not in s: raise SystemExit('Plant card anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) Master Data: add two admin controls to Templates tab: Download + Upload Mapping 2D CSV.
          p=Path('src/components/MasterDataManager.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import { canManageMasterData } from "../utils/permissions";', 'import { canManageMasterData } from "../utils/permissions";\nimport { LayoutMappingItem, saveLayoutMapping } from "../lib/layoutMappingService";')
          anchor='  const fileInputRef = useRef<HTMLInputElement>(null);'
          inject=anchor+'''\n  const layoutFileInputRef = useRef<HTMLInputElement>(null);\n\n  const downloadLayoutMappingTemplate = () => {\n    const csv = [\n      "line_id,row,column,sequence",\n      "LINE-1,1,1,1",\n      "LINE-2,2,1,2",\n      "LINE-3,2,2,3",\n      "LINE-4,1,2,4"\n    ].join("\\n");\n    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement("a");\n    a.href = url;\n    a.download = "template_mapping_2d.csv";\n    a.click();\n    URL.revokeObjectURL(url);\n  };\n\n  const handleLayoutMappingUpload = (e: React.ChangeEvent<HTMLInputElement>) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n    Papa.parse<Record<string, string>>(file, {\n      header: true, skipEmptyLines: "greedy",\n      complete: async ({ data }) => {\n        try {\n          const seen = new Set<string>();\n          const items: LayoutMappingItem[] = data.map((row, index) => {\n            const lineId = String(row.line_id || "").trim();\n            const r = Number.parseInt(String(row.row || ""), 10);\n            const c = Number.parseInt(String(row.column || ""), 10);\n            const sequence = Number.parseInt(String(row.sequence || ""), 10);\n            if (!lineId || !Number.isInteger(r) || r < 1 || !Number.isInteger(c) || c < 1 || !Number.isInteger(sequence) || sequence < 1) throw new Error(`Baris ${index + 2}: line_id, row, column, sequence wajib valid dan > 0.`);\n            if (!lines.some((line) => line.id === lineId)) throw new Error(`Baris ${index + 2}: line_id ${lineId} tidak ditemukan di Master Line.`);\n            const cell = `${r}:${c}`;\n            if (seen.has(cell)) throw new Error(`Baris ${index + 2}: posisi row ${r}, column ${c} sudah digunakan.`);\n            seen.add(cell);\n            return { lineId, row: r, column: c, sequence };\n          });\n          await saveLayoutMapping(items, currentUser || undefined);\n          setUploadStatus({ success: true, message: `Mapping 2D berhasil disimpan: ${items.length} line.` });\n        } catch (err) {\n          setUploadStatus({ success: false, message: err instanceof Error ? err.message : String(err) });\n        } finally {\n          if (layoutFileInputRef.current) layoutFileInputRef.current.value = "";\n        }\n      },\n      error: (err) => setUploadStatus({ success: false, message: `Gagal membaca CSV mapping: ${err.message}` })\n    });\n  };'''
          if anchor not in s: raise SystemExit('MasterData ref anchor not found')
          s=s.replace(anchor,inject,1)
          # insert feature card before closing templates grid, using known clean-tab comment as boundary
          boundary='      {/* Sub Tab Content: 4. Clean Trial Data / Factory Reset */}'
          idx=s.find(boundary)
          if idx<0: raise SystemExit('Templates boundary not found')
          before=s[:idx]
          # Find final closing of templates block immediately before boundary.
          close='        </div>\n      )}\n\n'
          pos=before.rfind(close)
          if pos<0: raise SystemExit('Templates close not found')
          card='''          <div className={`border rounded-3xl p-5 space-y-3 shadow-sm ${isLight ? "bg-white border-slate-200" : "bg-neutral-900 border-neutral-800"}`}>\n            <div className="flex items-center gap-2">\n              <Map className="w-5 h-5 text-emerald-500" />\n              <h4 className={`font-black text-sm ${isLight ? "text-slate-900" : "text-white"}`}>Mapping Layout 2D</h4>\n            </div>\n            <p className={`text-xs ${isLight ? "text-slate-600" : "text-neutral-400"}`}>\n              {language === "id" ? "Atur posisi visual setiap Line dengan row, column, dan urutan proses. Desain card Mapping 2D tetap sama." : "Configure each Line position using row, column, and process sequence. Existing 2D map cards are preserved."}\n            </p>\n            <div className="flex flex-wrap gap-2">\n              <button onClick={downloadLayoutMappingTemplate} className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border ${isLight ? "bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-300" : "bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border-neutral-700"}`}>\n                <Download className="w-3.5 h-3.5" /> Download Template Layout 2D\n              </button>\n              {canManageMaster && <>\n                <input ref={layoutFileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleLayoutMappingUpload} />\n                <button onClick={() => layoutFileInputRef.current?.click()} className="px-4 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white">\n                  <Upload className="w-3.5 h-3.5" /> Upload Mapping Layout 2D\n                </button>\n              </>}\n            </div>\n            <div className={`text-[10px] font-mono ${isLight ? "text-slate-500" : "text-neutral-500"}`}>CSV: line_id,row,column,sequence</div>\n          </div>\n'''
          before=before[:pos]+card+before[pos:]
          s=before+s[idx:]
          # Map icon already not imported in MasterData; add it.
          s=s.replace('  Building2\n} from "lucide-react";', '  Building2,\n  Map\n} from "lucide-react";')
          p.write_text(s,encoding='utf-8')
      - name: Build and verify
        run: |
          npm run build
          git diff --check
      - name: Commit source changes and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-layout-mapping-csv.yml
          git add src/components/PlantLayoutMap.tsx src/components/MasterDataManager.tsx src/lib/layoutMappingService.ts
          git commit -m "feat: add CSV configurable 2D plant layout mapping"
          git push
